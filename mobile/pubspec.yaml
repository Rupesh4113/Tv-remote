name: remoteone
description: "RemoteOne - Universal TV & Set-Top Box Remote Control Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management & DI
  provider: ^6.1.1

  # Local Persistence & Secure Storage
  shared_preferences: ^2.2.2

  # Networking & Sockets
  http: ^1.2.0
  web_socket_channel: ^2.4.1

  # Hardware: Haptics & Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/profiles/
