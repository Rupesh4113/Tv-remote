name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  release:
    types: [published, created]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Setup Gradle Wrapper and Build Release APK
        working-directory: mobile
        run: |
          mkdir -p android/gradle/wrapper

          # Download official gradle-wrapper.jar if not present
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fetching gradle-wrapper.jar..."
            curl -sSL -o android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.3.0/gradle/wrapper/gradle-wrapper.jar || true
          fi

          # Ensure gradlew exists
          FLUTTER_DIR=$(dirname $(dirname $(which flutter)))
          if [ ! -f android/gradlew ] && [ -f "$FLUTTER_DIR/packages/flutter_tools/templates/app_shared/android.tmpl/gradlew" ]; then
            cp "$FLUTTER_DIR/packages/flutter_tools/templates/app_shared/android.tmpl/gradlew" android/
            cp "$FLUTTER_DIR/packages/flutter_tools/templates/app_shared/android.tmpl/gradlew.bat" android/
          fi
          chmod +x android/gradlew || true

          flutter pub get
          flutter build apk --release

          echo "Searching for built APKs:"
          find build -name "*.apk" -ls

      - name: Stage Release APK
        run: |
          mkdir -p release-apk
          APK_FILE=$(find mobile/build -type f -name "app-release.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find mobile/build -type f -name "*.apk" | head -n 1)
          fi
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK found in mobile/build"
            exit 1
          fi
          echo "Selected APK: $APK_FILE"
          cp "$APK_FILE" release-apk/app-release.apk
          ls -lh release-apk/app-release.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: remoteone-release-apk
          path: release-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'v1.0.0' }}
          name: ${{ github.event.release.name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'RemoteOne v1.0.0 Release' }}
          body: |
            ## RemoteOne — Universal TV & Set-Top Box Remote
            
            ### Release APK
            - File: `app-release.apk`
            - Built with Flutter 3.22 & Android SDK 34
            - Includes offline device profiles for Samsung, Sony, LG, Tata Play, Airtel, Dish TV, etc.
            - Features IR Blaster control, Wi-Fi LAN discovery, Hardware Diagnostics, and Live Test Mode.
            
            ### Download & Install
            1. Download `app-release.apk` below directly to your phone.
            2. Open the file to install (allow installs from unknown sources if prompted).
            3. Open RemoteOne and run the First-Run Hardware Check.
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: release-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
